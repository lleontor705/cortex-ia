name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"

      - name: Run unit tests
        run: go test -v -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11.4

  race-qualification:
    name: Linux amd64 CGO Race Qualification
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"

      - name: Capture toolchain facts
        shell: bash
        run: |
          mkdir -p qualification-evidence
          {
            echo "goos=$GOOS"
            echo "goarch=$GOARCH"
            echo "cgo_enabled=$CGO_ENABLED"
            echo "command=CGO_ENABLED=1 go test -race -count=1 ./..."
            echo "go_version=$(go version)"
            echo "compiler=$(gcc --version | head -n 1)"
            echo "retry_budget=0"
          } > qualification-evidence/race.txt

      - name: Run pinned race qualification
        shell: bash
        run: |
          set +e
          CGO_ENABLED=1 go test -race -count=1 ./... 2>&1 | tee qualification-evidence/race-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> qualification-evidence/race.txt
          exit "$status"

      - name: Upload race qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-amd64-cgo-race-evidence
          path: qualification-evidence/
          if-no-files-found: error

  approve-release:
    name: Approve Release
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, race-qualification]
    environment: production
    steps:
      - name: Approval confirmed
        run: echo "Release approved — proceeding to publish."

  goreleaser:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: approve-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi



      - name: Create and push tag
        env:
          TAG: ${{ steps.tag.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.1"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          CORTEX_REPORT_ENDPOINT: ${{ vars.CORTEX_REPORT_ENDPOINT || 'https://cortex-report-hub-production.up.railway.app/api/v1/reports' }}
          CORTEX_REPORT_SECRET: ${{ secrets.CORTEX_REPORT_SECRET }}
