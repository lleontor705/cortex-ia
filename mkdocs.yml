site_name: cortex-ia
site_url: https://lleontor705.github.io/cortex-ia/
repo_url: https://github.com/lleontor705/cortex-ia
repo_name: lleontor705/cortex-ia
docs_dir: docs

strict: true

# The docs cross-reference repository files outside docs_dir (SKILL contracts
# under internal/assets/skills/_shared/). MkDocs cannot resolve those as doc
# targets, so keep them visible at info level instead of failing the strict build.
validation:
  links:
    not_found: info

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.top
    - navigation.sections

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Installation: installation.md
      - Non-interactive usage: non-interactive.md
      - Platforms: platforms.md
      - Configuration: configuration.md
  - Architecture:
      - Architecture: architecture.md
      - Codebase guide: CODEBASE-GUIDE.md
      - Codebase:
          - Mental model: codebase/mental-model.md
          - Repository map: codebase/repository-map.md
          - Interfaces: codebase/interfaces.md
          - Reference map: codebase/reference-map.md
          - MCP boundaries: codebase/mcp-boundaries.md
          - Integrations: codebase/integrations.md
          - Sync and cloud: codebase/sync-and-cloud.md
          - Dashboard: codebase/dashboard.md
          - SDD coordination: codebase/sdd-coordination.md
          - Project and extension: codebase/project-and-extension.md
          - Maintainer playbook: codebase/maintainer-playbook.md
  - Operations:
      - Agents: agents.md
      - Components: components.md
      - MCP: mcp.md
      - SDD workflow: sdd-workflow.md
      - Cortex memory: cortex-memory.md
      - Rollback: rollback.md
      - Docker E2E testing: docker-e2e-testing.md
      - Security: security.md
      - Release keys: release-keys.md
  - Reference:
      - Cortex report hub snapshot: cortex-report-hub-snapshot.md
      - MCP qualification: mcp-qualification.md
      - Qualification inputs: qualification-inputs.md
      - SDK qualification: sdk-qualification.md
