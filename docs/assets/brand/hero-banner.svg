<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Cortex-IA</title>
  <desc id="heroDesc">Cortex-IA banner: a deterministic multi-agent control plane for OpenCode, Claude Code and Antigravity CLI, shown next to a small task board where tasks move from ready to in progress, in review and done.</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#0B1528"/>
    </linearGradient>
    <linearGradient id="heroAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .brand { font-size: 60px; font-weight: 800; letter-spacing: -1.5px; fill: #F8FAFC; }
    .tag { font-size: 19px; font-weight: 600; fill: #CBD5E1; }
    .desc { font-size: 14px; fill: #93A4BF; }
    .pill { font-size: 13px; font-weight: 600; fill: #E2E8F0; }
    .cmd { font-size: 14px; fill: #7DD3FC; }
    .col { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; }
    .card { font-size: 11.5px; fill: #E2E8F0; }
    .meta { font-size: 10px; fill: #93A4BF; }
  </style>

  <rect width="1200" height="420" rx="16" fill="url(#heroBg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="60" y="64" width="56" height="5" rx="2.5" fill="url(#heroAccent)"/>

  <text x="60" y="138" class="t brand">Cortex<tspan fill="#38BDF8">-IA</tspan></text>
  <text x="60" y="178" class="t tag">Deterministic control plane for multi-agent coding</text>
  <text x="60" y="208" class="t desc">Task graph, exclusive file leases and review gates in one local Go binary.</text>

  <g>
    <rect x="60" y="238" width="112" height="34" rx="17" fill="#111A2E" stroke="#38BDF8"/>
    <text x="116" y="260" class="t pill" text-anchor="middle">OpenCode</text>
    <rect x="184" y="238" width="128" height="34" rx="17" fill="#111A2E" stroke="#334155"/>
    <text x="248" y="260" class="t pill" text-anchor="middle">Claude Code</text>
    <rect x="324" y="238" width="188" height="34" rx="17" fill="#111A2E" stroke="#334155"/>
    <text x="418" y="260" class="t pill" text-anchor="middle">Antigravity CLI (agy)</text>
  </g>

  <rect x="60" y="304" width="452" height="56" rx="10" fill="#0B1220" stroke="#23304A" stroke-width="1.5"/>
  <text x="82" y="338" class="m cmd"><tspan fill="#A78BFA">$</tspan> cortex-ia install <tspan fill="#64748B">&amp;&amp;</tspan> cortex-ia web --open</text>

  <!-- task board -->
  <rect x="620" y="52" width="520" height="316" rx="12" fill="#0F1A30" stroke="#23304A" stroke-width="1.5"/>
  <text x="644" y="84" class="m meta" style="font-size:11.5px">board: auth-refresh · 4 tasks</text>
  <path d="M620 100 H1140" stroke="#23304A" stroke-width="1.5"/>

  <text x="644" y="126" class="t col" fill="#7DD3FC">READY</text>
  <text x="770" y="126" class="t col" fill="#C4B5FD">IN PROGRESS</text>
  <text x="896" y="126" class="t col" fill="#FCD34D">IN REVIEW</text>
  <text x="1022" y="126" class="t col" fill="#6EE7B7">DONE</text>

  <path d="M758 112 V348 M884 112 V348 M1010 112 V348" stroke="#1E293B" stroke-width="1.5"/>

  <rect x="640" y="142" width="106" height="62" rx="8" fill="#0E2233" stroke="#38BDF8"/>
  <text x="652" y="166" class="m card">auth-1.4</text>
  <text x="652" y="186" class="t meta">deps approved</text>

  <rect x="766" y="142" width="106" height="84" rx="8" fill="#17152F" stroke="#A78BFA"/>
  <text x="778" y="166" class="m card">auth-1.3</text>
  <text x="778" y="186" class="t meta">claim live</text>
  <text x="778" y="204" class="t meta">2 files leased</text>

  <rect x="892" y="142" width="106" height="62" rx="8" fill="#2A2110" stroke="#FBBF24"/>
  <text x="904" y="166" class="m card">auth-1.2</text>
  <text x="904" y="186" class="t meta">awaiting verdict</text>

  <rect x="1018" y="142" width="106" height="62" rx="8" fill="#0F2420" stroke="#34D399"/>
  <text x="1030" y="166" class="m card">auth-1.1</text>
  <text x="1030" y="186" class="t meta">approved PASS</text>

  <rect x="640" y="304" width="484" height="44" rx="8" fill="#0B1220" stroke="#23304A"/>
  <text x="656" y="331" class="t meta" style="font-size:11.5px">Only an approved PASS verdict moves a task to done.</text>
</svg>
