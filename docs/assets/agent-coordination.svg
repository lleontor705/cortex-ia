<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="960" height="480" rx="12" fill="#0f1117"/>

  <text x="480" y="32" text-anchor="middle" fill="#c0caf5" font-size="18" font-weight="700">OpenCode Agent Coordination &amp; Protocols</text>
  <text x="480" y="50" text-anchor="middle" fill="#565f89" font-size="11">ForgeSpec CAS Control Plane · Cortex Persistent Evidence · File Reservation Leases · Typed Receipts</text>

  <!-- Column 1: ForgeSpec Control Plane -->
  <rect x="25" y="72" width="215" height="280" rx="8" fill="#1a1b26" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="132" y="94" text-anchor="middle" fill="#9ece6a" font-size="12" font-weight="700">ForgeSpec (Control Plane)</text>
  <text x="132" y="108" text-anchor="middle" fill="#565f89" font-size="9">DAG State &amp; Task Claims</text>

  <text x="45" y="132" fill="#c0caf5" font-size="9.5">forgespec_capabilities</text>
  <text x="225" y="132" fill="#565f89" font-size="8" text-anchor="end">direct-v1 mode</text>
  <text x="45" y="152" fill="#c0caf5" font-size="9.5">tb_create_board</text>
  <text x="225" y="152" fill="#565f89" font-size="8" text-anchor="end">init DAG</text>
  <text x="45" y="172" fill="#c0caf5" font-size="9.5">tb_add_task</text>
  <text x="225" y="172" fill="#565f89" font-size="8" text-anchor="end">add bounded node</text>
  <text x="45" y="192" fill="#c0caf5" font-size="9.5">tb_query</text>
  <text x="225" y="192" fill="#565f89" font-size="8" text-anchor="end">read DAG state</text>
  <text x="45" y="212" fill="#c0caf5" font-size="9.5">tb_claim</text>
  <text x="225" y="212" fill="#81C784" font-size="8" text-anchor="end">acquire attempt</text>
  <text x="45" y="232" fill="#c0caf5" font-size="9.5">tb_heartbeat</text>
  <text x="225" y="232" fill="#81C784" font-size="8" text-anchor="end">renew claim TTL</text>
  <text x="45" y="252" fill="#c0caf5" font-size="9.5">tb_update</text>
  <text x="225" y="252" fill="#81C784" font-size="8" text-anchor="end">CAS status change</text>
  <text x="45" y="272" fill="#c0caf5" font-size="9.5">tb_events</text>
  <text x="225" y="272" fill="#565f89" font-size="8" text-anchor="end">audit trail</text>
  <text x="45" y="292" fill="#c0caf5" font-size="9.5">tb_approve</text>
  <text x="225" y="292" fill="#f7768e" font-size="8" text-anchor="end">review gate</text>

  <!-- Column 2: File Reservation Leases -->
  <rect x="255" y="72" width="215" height="280" rx="8" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="362" y="94" text-anchor="middle" fill="#7aa2f7" font-size="12" font-weight="700">File Leases (Concurrency)</text>
  <text x="362" y="108" text-anchor="middle" fill="#565f89" font-size="9">Atomic Advisory Locks</text>

  <rect x="270" y="122" width="185" height="42" rx="5" fill="#1e2030" stroke="#7aa2f7" stroke-width="1"/>
  <text x="362" y="140" text-anchor="middle" fill="#7aa2f7" font-size="10" font-weight="600">file_reserve</text>
  <text x="362" y="155" text-anchor="middle" fill="#565f89" font-size="8">Acquire exclusive lease per path</text>

  <rect x="270" y="172" width="185" height="42" rx="5" fill="#1e2030" stroke="#7aa2f7" stroke-width="1"/>
  <text x="362" y="190" text-anchor="middle" fill="#7aa2f7" font-size="10" font-weight="600">file_renew</text>
  <text x="362" y="205" text-anchor="middle" fill="#565f89" font-size="8">Extend lease TTL while editing</text>

  <rect x="270" y="222" width="185" height="42" rx="5" fill="#1e2030" stroke="#7aa2f7" stroke-width="1"/>
  <text x="362" y="240" text-anchor="middle" fill="#7aa2f7" font-size="10" font-weight="600">file_release</text>
  <text x="362" y="255" text-anchor="middle" fill="#565f89" font-size="8">Release files on PASS / FAIL / BLOCKED</text>

  <text x="362" y="295" text-anchor="middle" fill="#e0af68" font-size="9" font-style="italic">Prevents cross-minion races</text>
  <text x="362" y="312" text-anchor="middle" fill="#565f89" font-size="8">Strictly disjoint allowed_files per minion</text>

  <!-- Column 3: Cortex Evidence Plane -->
  <rect x="485" y="72" width="215" height="280" rx="8" fill="#1a1b26" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="592" y="94" text-anchor="middle" fill="#7dcfff" font-size="12" font-weight="700">Cortex (Evidence Plane)</text>
  <text x="592" y="108" text-anchor="middle" fill="#565f89" font-size="9">Cross-Session Durable Memory</text>

  <text x="505" y="132" fill="#c0caf5" font-size="9.5">cortex_session_start</text>
  <text x="685" y="132" fill="#565f89" font-size="8" text-anchor="end">bind session</text>
  <text x="505" y="155" fill="#c0caf5" font-size="9.5">cortex_search</text>
  <text x="685" y="155" fill="#565f89" font-size="8" text-anchor="end">hybrid query</text>
  <text x="505" y="178" fill="#c0caf5" font-size="9.5">cortex_save</text>
  <text x="685" y="178" fill="#7dcfff" font-size="8" text-anchor="end">persist evidence</text>
  <text x="505" y="201" fill="#c0caf5" font-size="9.5">cortex_session_summary</text>
  <text x="685" y="201" fill="#565f89" font-size="8" text-anchor="end">checkpoint</text>
  <text x="505" y="224" fill="#c0caf5" font-size="9.5">cortex_session_end</text>
  <text x="685" y="224" fill="#565f89" font-size="8" text-anchor="end">close &amp; flush</text>

  <rect x="500" y="250" width="185" height="42" rx="5" fill="#1e2030" stroke="#4A90D9" stroke-width="1"/>
  <text x="592" y="268" text-anchor="middle" fill="#7dcfff" font-size="9.5" font-weight="600">context-distiller</text>
  <text x="592" y="283" text-anchor="middle" fill="#565f89" font-size="8">Minimizes failure locality &amp; diffs</text>

  <!-- Column 4: Background Supervisor -->
  <rect x="715" y="72" width="220" height="280" rx="8" fill="#1a1b26" stroke="#e0af68" stroke-width="1.5"/>
  <text x="825" y="94" text-anchor="middle" fill="#e0af68" font-size="12" font-weight="700">Supervisor &amp; Receipts</text>
  <text x="825" y="108" text-anchor="middle" fill="#565f89" font-size="9">Asynchronous Minion Lifecycle</text>

  <text x="735" y="132" fill="#c0caf5" font-size="9.5">task(..., background=true)</text>
  <text x="735" y="155" fill="#c0caf5" font-size="9.5">background_status</text>
  <text x="735" y="178" fill="#c0caf5" font-size="9.5">background_tail</text>
  <text x="735" y="201" fill="#c0caf5" font-size="9.5">background_recover</text>
  <text x="735" y="224" fill="#c0caf5" font-size="9.5">background_cancel</text>

  <rect x="730" y="250" width="190" height="42" rx="5" fill="#1e2030" stroke="#e0af68" stroke-width="1"/>
  <text x="825" y="268" text-anchor="middle" fill="#e0af68" font-size="9.5" font-weight="600">Receipt v2.0 Contract</text>
  <text x="825" y="283" text-anchor="middle" fill="#565f89" font-size="8">PASS | FAIL | BLOCKED | INCONCLUSIVE</text>

  <!-- Protocols Guide Footer -->
  <text x="480" y="380" text-anchor="middle" fill="#c0caf5" font-size="12.5" font-weight="600">Coordination Invariants</text>

  <rect x="25" y="396" width="215" height="30" rx="5" fill="#1e2030" stroke="#2E7D32" stroke-width="1"/>
  <text x="132" y="415" text-anchor="middle" fill="#9ece6a" font-size="9">Orchestrator never edits code</text>

  <rect x="255" y="396" width="215" height="30" rx="5" fill="#1e2030" stroke="#7aa2f7" stroke-width="1"/>
  <text x="362" y="415" text-anchor="middle" fill="#7aa2f7" font-size="9">File leases mandatory before writes</text>

  <rect x="485" y="396" width="215" height="30" rx="5" fill="#1e2030" stroke="#4A90D9" stroke-width="1"/>
  <text x="592" y="415" text-anchor="middle" fill="#7dcfff" font-size="9">Reviewer never trusts prose claims</text>

  <rect x="715" y="396" width="220" height="30" rx="5" fill="#1e2030" stroke="#e0af68" stroke-width="1"/>
  <text x="825" y="415" text-anchor="middle" fill="#e0af68" font-size="9">Deterministic verification oracles</text>

  <!-- Footer -->
  <text x="480" y="455" text-anchor="middle" fill="#3b3f54" font-size="8.5">cortex-ia · OpenCode Multi-Agent Runtime</text>
</svg>
