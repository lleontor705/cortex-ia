<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="880" height="440" rx="12" fill="#0f1117"/>

  <text x="440" y="32" text-anchor="middle" fill="#c0caf5" font-size="18" font-weight="700">OpenCode Task Routing &amp; Slash Commands</text>
  <text x="440" y="50" text-anchor="middle" fill="#565f89" font-size="11">How user intent maps to OpenCode commands, execution routes, and sub-agents</text>

  <!-- Column headers -->
  <text x="100" y="74" text-anchor="middle" fill="#7aa2f7" font-size="10.5" font-weight="600" letter-spacing="0.5">INTENT / SCENARIO</text>
  <text x="320" y="74" text-anchor="middle" fill="#9ece6a" font-size="10.5" font-weight="600" letter-spacing="0.5">SLASH COMMAND</text>
  <text x="640" y="74" text-anchor="middle" fill="#e0af68" font-size="10.5" font-weight="600" letter-spacing="0.5">DISPATCHED AGENT &amp; ROUTE</text>

  <!-- Row 1: Full SDD / Feature -->
  <rect x="15" y="86" width="170" height="30" rx="5" fill="#1e2030" stroke="#7aa2f7" stroke-width="1"/>
  <text x="100" y="105" text-anchor="middle" fill="#c0caf5" font-size="10">Feature / Arch Change</text>
  <rect x="230" y="86" width="180" height="30" rx="5" fill="#1e2030" stroke="#7aa2f7" stroke-width="1.2"/>
  <text x="320" y="105" text-anchor="middle" fill="#7aa2f7" font-size="11" font-weight="600">/sdd</text>
  <rect x="450" y="86" width="415" height="30" rx="5" fill="#1e2030" stroke="#7aa2f7" stroke-width="1"/>
  <text x="657" y="105" text-anchor="middle" fill="#c0caf5" font-size="9.5">@planner ──▶ @implement (DAG) ──▶ @reviewer</text>

  <!-- Row 2: Hotfix / Incident -->
  <rect x="15" y="124" width="170" height="30" rx="5" fill="#1e2030" stroke="#f7768e" stroke-width="1"/>
  <text x="100" y="143" text-anchor="middle" fill="#c0caf5" font-size="10">Incident / Urgent Bug</text>
  <rect x="230" y="124" width="180" height="30" rx="5" fill="#1e2030" stroke="#f7768e" stroke-width="1.2"/>
  <text x="320" y="143" text-anchor="middle" fill="#f7768e" font-size="11" font-weight="600">/hotfix</text>
  <rect x="450" y="124" width="415" height="30" rx="5" fill="#1e2030" stroke="#f7768e" stroke-width="1"/>
  <text x="657" y="143" text-anchor="middle" fill="#c0caf5" font-size="9.5">@implement (hotfix-triage) ──▶ @reviewer</text>

  <!-- Row 3: Fast TDD -->
  <rect x="15" y="162" width="170" height="30" rx="5" fill="#1e2030" stroke="#9ece6a" stroke-width="1"/>
  <text x="100" y="181" text-anchor="middle" fill="#c0caf5" font-size="10">Fast Unit Test Oracle</text>
  <rect x="230" y="162" width="180" height="30" rx="5" fill="#1e2030" stroke="#9ece6a" stroke-width="1.2"/>
  <text x="320" y="181" text-anchor="middle" fill="#9ece6a" font-size="11" font-weight="600">/tdd</text>
  <rect x="450" y="162" width="415" height="30" rx="5" fill="#1e2030" stroke="#9ece6a" stroke-width="1"/>
  <text x="657" y="181" text-anchor="middle" fill="#c0caf5" font-size="9.5">@implement (fast-tdd + RED ──▶ GREEN ──▶ Refactor)</text>

  <!-- Row 4: Direct Work / Bounded Task -->
  <rect x="15" y="200" width="170" height="30" rx="5" fill="#1e2030" stroke="#2E7D32" stroke-width="1"/>
  <text x="100" y="219" text-anchor="middle" fill="#c0caf5" font-size="10">Bounded Direct Change</text>
  <rect x="230" y="200" width="180" height="30" rx="5" fill="#1e2030" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="320" y="219" text-anchor="middle" fill="#2E7D32" font-size="11" font-weight="600">/work</text>
  <rect x="450" y="200" width="415" height="30" rx="5" fill="#1e2030" stroke="#2E7D32" stroke-width="1"/>
  <text x="657" y="219" text-anchor="middle" fill="#c0caf5" font-size="9.5">@implement (Single Task Claim + Atomic File Lease)</text>

  <!-- Row 5: Adversarial Review -->
  <rect x="15" y="238" width="170" height="30" rx="5" fill="#1e2030" stroke="#D32F2F" stroke-width="1"/>
  <text x="100" y="257" text-anchor="middle" fill="#c0caf5" font-size="10">Quality Gate &amp; Security</text>
  <rect x="230" y="238" width="180" height="30" rx="5" fill="#1e2030" stroke="#D32F2F" stroke-width="1.2"/>
  <text x="320" y="257" text-anchor="middle" fill="#D32F2F" font-size="11" font-weight="600">/review</text>
  <rect x="450" y="238" width="415" height="30" rx="5" fill="#1e2030" stroke="#D32F2F" stroke-width="1"/>
  <text x="657" y="257" text-anchor="middle" fill="#c0caf5" font-size="9.5">@reviewer (code-review-adversary + mutation tests)</text>

  <!-- Row 6: Spike Prototype -->
  <rect x="15" y="276" width="170" height="30" rx="5" fill="#1e2030" stroke="#ff9e64" stroke-width="1"/>
  <text x="100" y="295" text-anchor="middle" fill="#c0caf5" font-size="10">Technical Uncertainty</text>
  <rect x="230" y="276" width="180" height="30" rx="5" fill="#1e2030" stroke="#ff9e64" stroke-width="1.2"/>
  <text x="320" y="295" text-anchor="middle" fill="#ff9e64" font-size="11" font-weight="600">/spike</text>
  <rect x="450" y="276" width="415" height="30" rx="5" fill="#1e2030" stroke="#ff9e64" stroke-width="1"/>
  <text x="657" y="295" text-anchor="middle" fill="#c0caf5" font-size="9.5">@investigate (spike-prototype in disposable scratch)</text>

  <!-- Row 7: Diagnostic Investigation -->
  <rect x="15" y="314" width="170" height="30" rx="5" fill="#1e2030" stroke="#78909C" stroke-width="1"/>
  <text x="100" y="333" text-anchor="middle" fill="#c0caf5" font-size="10">Root Cause Diagnosis</text>
  <rect x="230" y="314" width="180" height="30" rx="5" fill="#1e2030" stroke="#78909C" stroke-width="1.2"/>
  <text x="320" y="333" text-anchor="middle" fill="#78909C" font-size="11" font-weight="600">/investigate</text>
  <rect x="450" y="314" width="415" height="30" rx="5" fill="#1e2030" stroke="#78909C" stroke-width="1"/>
  <text x="657" y="333" text-anchor="middle" fill="#c0caf5" font-size="9.5">@investigate (Read-Only Code Audit &amp; Hypothesis Map)</text>

  <!-- Row 8: Status & Resume -->
  <rect x="15" y="352" width="170" height="30" rx="5" fill="#1e2030" stroke="#565f89" stroke-width="1"/>
  <text x="100" y="371" text-anchor="middle" fill="#c0caf5" font-size="10">Session Tracking</text>
  <rect x="230" y="352" width="180" height="30" rx="5" fill="#1e2030" stroke="#565f89" stroke-width="1.2"/>
  <text x="320" y="371" text-anchor="middle" fill="#c0caf5" font-size="11" font-weight="600">/status | /resume</text>
  <rect x="450" y="352" width="415" height="30" rx="5" fill="#1e2030" stroke="#565f89" stroke-width="1"/>
  <text x="657" y="371" text-anchor="middle" fill="#c0caf5" font-size="9.5">@orchestrator (Reconcile ForgeSpec CAS &amp; Cortex Session)</text>

  <!-- Connectors -->
  <line x1="185" y1="101" x2="228" y2="101" stroke="#4A90D9" stroke-width="1"/>
  <polygon points="226,98 232,101 226,104" fill="#4A90D9"/>
  <line x1="410" y1="101" x2="448" y2="101" stroke="#4A90D9" stroke-width="1"/>
  <polygon points="446,98 452,101 446,104" fill="#4A90D9"/>

  <line x1="185" y1="139" x2="228" y2="139" stroke="#f7768e" stroke-width="1"/>
  <polygon points="226,136 232,139 226,142" fill="#f7768e"/>
  <line x1="410" y1="139" x2="448" y2="139" stroke="#f7768e" stroke-width="1"/>
  <polygon points="446,136 452,139 446,142" fill="#f7768e"/>

  <line x1="185" y1="177" x2="228" y2="177" stroke="#9ece6a" stroke-width="1"/>
  <polygon points="226,174 232,177 226,180" fill="#9ece6a"/>
  <line x1="410" y1="177" x2="448" y2="177" stroke="#9ece6a" stroke-width="1"/>
  <polygon points="446,174 452,177 446,180" fill="#9ece6a"/>

  <line x1="185" y1="215" x2="228" y2="215" stroke="#2E7D32" stroke-width="1"/>
  <polygon points="226,212 232,215 226,218" fill="#2E7D32"/>
  <line x1="410" y1="215" x2="448" y2="215" stroke="#2E7D32" stroke-width="1"/>
  <polygon points="446,212 452,215 446,218" fill="#2E7D32"/>

  <!-- Legend / Footer -->
  <text x="440" y="415" text-anchor="middle" fill="#565f89" font-size="9">All commands run in OpenCode · Supported by Cortex, ForgeSpec &amp; Context7 MCPs</text>
