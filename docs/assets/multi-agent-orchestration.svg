<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOrch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>

    <filter id="shadowOrch" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <style>
    .title-orch { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
    .sub-orch { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748B; text-anchor: middle; }
    .role-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; }
    .role-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; fill: #94A3B8; }
    .tool-item { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #CBD5E1; }
    .badge-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 700; text-transform: uppercase; }
  </style>

  <rect width="1080" height="570" rx="14" fill="url(#bgOrch)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="540" y="38" class="title-orch">OpenCode 6-Role Topology &amp; Delegation Architecture</text>
  <text x="540" y="58" class="sub-orch">Single Orchestrator Coordinator · Ephemeral Subagent Controllers · Typed SQLite Authority · Sandboxed Herdr Workers</text>

  <!-- Orchestrator Box (Top Center) -->
  <g transform="translate(390, 80)" filter="url(#shadowOrch)">
    <rect width="300" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <rect width="300" height="30" rx="10" fill="#0369A1" fill-opacity="0.3"/>
    <path d="M 0 20 L 0 30 L 300 30 L 300 20 Z" fill="#0369A1" fill-opacity="0.3"/>
    
    <text x="15" y="20" class="role-title" fill="#38BDF8">👑 ORCHESTRATOR</text>
    <rect x="210" y="8" width="75" height="15" rx="4" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="247" y="19" class="badge-tag" fill="#38BDF8" text-anchor="middle">PRIMARY</text>

    <text x="15" y="50" class="role-sub">Startup alignment, organic routing, session lifecycle, task DAG dispatch</text>
    <text x="15" y="72" class="tool-item" fill="#7DD3FC">Tools: cortex_session_* · grill-me · board create · work recover</text>
    <text x="15" y="90" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">Rules: Never claims tasks, never holds file leases directly</text>
  </g>

  <!-- Connectors from Orchestrator to 5 Subagents -->
  <path d="M 430 190 L 124 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 480 190 L 332 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 540 190 L 540 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 600 190 L 748 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 650 190 L 956 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Role 1: DISCOVERY -->
  <g transform="translate(27, 240)" filter="url(#shadowOrch)">
    <rect width="194" height="155" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
    <rect width="194" height="26" rx="8" fill="#0E7490" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 194 26 L 194 18 Z" fill="#0E7490" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#22D3EE">🧭 DISCOVERY</text>
    <text x="12" y="44" class="role-sub">Skills, stack, engines &amp; profile</text>
    <text x="12" y="68" class="tool-item">read · glob · list</text>
    <text x="12" y="86" class="tool-item">cortex-ia doctor</text>
    <text x="12" y="104" class="tool-item">cortex_ia_discovery_write</text>
    <text x="12" y="122" class="tool-item">.cortex-ia/discovery.md</text>
    <rect x="10" y="132" width="174" height="16" rx="4" fill="#0E7490" fill-opacity="0.3"/>
    <text x="97" y="143" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67E8F9">Native Only (No External)</text>
  </g>

  <!-- Role 2: INVESTIGATE -->
  <g transform="translate(235, 240)" filter="url(#shadowOrch)">
    <rect width="194" height="155" rx="8" fill="#0F172A" stroke="#EAB308" stroke-width="1.5"/>
    <rect width="194" height="26" rx="8" fill="#854D0E" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 194 26 L 194 18 Z" fill="#854D0E" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#FACC15">🔍 INVESTIGATE</text>
    <text x="12" y="44" class="role-sub">Root-cause discovery, spikes, audits</text>
    <text x="12" y="68" class="tool-item">read · grep · glob · list</text>
    <text x="12" y="86" class="tool-item">cortex_get_blast_radius</text>
    <text x="12" y="104" class="tool-item">cortex_save (gotchas)</text>
    <text x="12" y="122" class="tool-item">read-only bash probes</text>
    <rect x="10" y="132" width="174" height="16" rx="4" fill="#854D0E" fill-opacity="0.3"/>
    <text x="97" y="143" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDE047">Delegable ➔ AGY (plan mode)</text>
  </g>

  <!-- Role 3: PLANNER -->
  <g transform="translate(443, 240)" filter="url(#shadowOrch)">
    <rect width="194" height="155" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="194" height="26" rx="8" fill="#3730A3" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 194 26 L 194 18 Z" fill="#3730A3" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#A5B4FC">📐 PLANNER</text>
    <text x="12" y="44" class="role-sub">OpenSpec specs, DAG (≤350 LOC)</text>
    <text x="12" y="68" class="tool-item">cortex_ia_openspec_val</text>
    <text x="12" y="86" class="tool-item">cortex_ia_work_create</text>
    <text x="12" y="104" class="tool-item">cortex_ia_board_create</text>
    <text x="12" y="122" class="tool-item">cortex_ia_change_archive</text>
    <rect x="10" y="132" width="174" height="16" rx="4" fill="#3730A3" fill-opacity="0.3"/>
    <text x="97" y="143" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C7D2FE">Decomposes DAG into Backlog</text>
  </g>

  <!-- Role 4: IMPLEMENT -->
  <g transform="translate(651, 240)" filter="url(#shadowOrch)">
    <rect width="194" height="155" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect width="194" height="26" rx="8" fill="#064E3B" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 194 26 L 194 18 Z" fill="#064E3B" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#34D399">⚡ IMPLEMENT</text>
    <text x="12" y="44" class="role-sub">Task claim, file lease, TDD &amp; code</text>
    <text x="12" y="68" class="tool-item">work claim &amp; file_reserve</text>
    <text x="12" y="86" class="tool-item">edit &amp; bash (fast-tdd)</text>
    <text x="12" y="104" class="tool-item">cortex_ia_work_transition</text>
    <text x="12" y="122" class="tool-item">typed receipt ➔ in_review</text>
    <rect x="10" y="132" width="174" height="16" rx="4" fill="#064E3B" fill-opacity="0.4"/>
    <text x="97" y="143" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6EE7B7">Delegable ➔ AGY (current_ws)</text>
  </g>

  <!-- Role 5: REVIEWER -->
  <g transform="translate(859, 240)" filter="url(#shadowOrch)">
    <rect width="194" height="155" rx="8" fill="#0F172A" stroke="#F43F5E" stroke-width="1.5"/>
    <rect width="194" height="26" rx="8" fill="#881337" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 194 26 L 194 18 Z" fill="#881337" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#FB7185">🛡️ REVIEWER</text>
    <text x="12" y="44" class="role-sub">Adversarial check, AST &amp; approval</text>
    <text x="12" y="68" class="tool-item">independent test runs</text>
    <text x="12" y="86" class="tool-item">git diff &amp; AST verification</text>
    <text x="12" y="104" class="tool-item">cortex_ia_work_approve</text>
    <text x="12" y="122" class="tool-item">verdict: PASS ➔ done</text>
    <rect x="10" y="132" width="174" height="16" rx="4" fill="#881337" fill-opacity="0.4"/>
    <text x="97" y="143" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDA4AF">Sole Authority to Mark DONE</text>
  </g>

  <!-- Bottom Section: Herdr Worker Multiplexing Layer -->
  <g transform="translate(27, 425)" filter="url(#shadowOrch)">
    <rect width="1026" height="115" rx="10" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="1026" height="26" rx="10" fill="#1E293B"/>
    <path d="M 0 16 L 0 26 L 1026 26 L 1026 16 Z" fill="#1E293B"/>
    <circle cx="16" cy="13" r="4" fill="#EF4444"/>
    <circle cx="30" cy="13" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="13" r="4" fill="#10B981"/>
    <text x="60" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38BDF8">CORTEX-IA WORK CONTROL PLANE &amp; DELEGATION ENGINE</text>

    <!-- Subprocess Info -->
    <g transform="translate(20, 38)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">⚡ Typed Task Authority &amp; Receipts:</text>
      <text x="240" y="15" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A855F7">cortex_ia_work_transition / cortex_ia_work_approve (Zero raw JSON in chat)</text>
      <text x="0" y="38" font-family="system-ui" font-size="10.5" fill="#94A3B8">Runs in dedicated Herdr terminal pane or native subagent with real-time streaming (tool calls, live spinner, token metrics).</text>
      <text x="0" y="56" font-family="system-ui" font-size="10.5" fill="#94A3B8">Receipts persist transactionally in SQLite (~/.cortex-ia/delegation.db). Chat output renders clean human-readable Markdown.</text>
    </g>
  </g>
</svg>
