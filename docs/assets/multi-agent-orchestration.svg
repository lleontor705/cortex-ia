<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOrch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>

    <filter id="shadowOrch" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <style>
    .title-orch { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
    .sub-orch { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748B; text-anchor: middle; }
    .role-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; }
    .role-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #94A3B8; }
    .tool-item { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #CBD5E1; }
    .badge-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 8.5px; font-weight: 700; text-transform: uppercase; }
  </style>

  <rect width="1050" height="560" rx="14" fill="url(#bgOrch)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="525" y="38" class="title-orch">OpenCode 5-Role Topology &amp; Delegation Architecture</text>
  <text x="525" y="58" class="sub-orch">Single Orchestrator Coordinator · Ephemeral Controllers · Sandboxed External Workers (Herdr / AGY)</text>

  <!-- Orchestrator Box (Top Center) -->
  <g transform="translate(375, 80)" filter="url(#shadowOrch)">
    <rect width="300" height="110" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <rect width="300" height="30" rx="10" fill="#0369A1" fill-opacity="0.3"/>
    <path d="M 0 20 L 0 30 L 300 30 L 300 20 Z" fill="#0369A1" fill-opacity="0.3"/>
    
    <text x="15" y="20" class="role-title" fill="#38BDF8">👑 ORCHESTRATOR</text>
    <rect x="210" y="8" width="75" height="15" rx="4" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="247" y="19" class="badge-tag" fill="#38BDF8" text-anchor="middle">PRIMARY</text>

    <text x="15" y="50" class="role-sub">Startup alignment, organic routing, session lifecycle, task DAG dispatch</text>
    <text x="15" y="72" class="tool-item" fill="#7DD3FC">Tools: cortex_session_* · grill-me · board create · work recover</text>
    <text x="15" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Rules: Never claims tasks, never holds file leases directly</text>
  </g>

  <!-- Connectors from Orchestrator to Roles -->
  <path d="M 420 190 L 150 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 480 190 L 375 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 570 190 L 650 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 630 190 L 890 240" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Role 1: INVESTIGATE -->
  <g transform="translate(45, 240)" filter="url(#shadowOrch)">
    <rect width="210" height="150" rx="8" fill="#0F172A" stroke="#EAB308" stroke-width="1.5"/>
    <rect width="210" height="26" rx="8" fill="#854D0E" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 210 26 L 210 18 Z" fill="#854D0E" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#FACC15">🔍 INVESTIGATE</text>
    <text x="12" y="45" class="role-sub">Root-cause discovery, spike analysis, read-only diagnostic audits</text>
    <text x="12" y="75" class="tool-item">read · grep · glob · list</text>
    <text x="12" y="95" class="tool-item">cortex_get_blast_radius</text>
    <text x="12" y="115" class="tool-item">cortex_save (gotchas)</text>
    <rect x="12" y="125" width="186" height="16" rx="4" fill="#854D0E" fill-opacity="0.3"/>
    <text x="105" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDE047">Delegable ➔ AGY (plan mode)</text>
  </g>

  <!-- Role 2: PLANNER -->
  <g transform="translate(280, 240)" filter="url(#shadowOrch)">
    <rect width="210" height="150" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
    <rect width="210" height="26" rx="8" fill="#3730A3" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 210 26 L 210 18 Z" fill="#3730A3" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#A5B4FC">📐 PLANNER</text>
    <text x="12" y="45" class="role-sub">OpenSpec delta specs (RFC 2119), Given/When/Then, Task DAG (≤350 LOC)</text>
    <text x="12" y="75" class="tool-item">openspec validate</text>
    <text x="12" y="95" class="tool-item">cortex-ia work create</text>
    <text x="12" y="115" class="tool-item">edit (openspec/changes/)</text>
    <rect x="12" y="125" width="186" height="16" rx="4" fill="#3730A3" fill-opacity="0.3"/>
    <text x="105" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C7D2FE">Decomposes DAG into Backlog</text>
  </g>

  <!-- Role 3: IMPLEMENT -->
  <g transform="translate(515, 240)" filter="url(#shadowOrch)">
    <rect width="225" height="150" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <rect width="225" height="26" rx="8" fill="#064E3B" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 225 26 L 225 18 Z" fill="#064E3B" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#34D399">⚡ IMPLEMENT</text>
    <text x="12" y="45" class="role-sub">Single task claim, exclusive file leases, TDD oracle &amp; review transition</text>
    <text x="12" y="75" class="tool-item">work claim &amp; work lease</text>
    <text x="12" y="95" class="tool-item">edit &amp; bash (tests/build)</text>
    <text x="12" y="115" class="tool-item">work transition --to in_review</text>
    <rect x="12" y="125" width="201" height="16" rx="4" fill="#064E3B" fill-opacity="0.4"/>
    <text x="112" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#6EE7B7">Delegable ➔ AGY (accept-edits)</text>
  </g>

  <!-- Role 4: REVIEWER -->
  <g transform="translate(765, 240)" filter="url(#shadowOrch)">
    <rect width="235" height="150" rx="8" fill="#0F172A" stroke="#F43F5E" stroke-width="1.5"/>
    <rect width="235" height="26" rx="8" fill="#881337" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 235 26 L 235 18 Z" fill="#881337" fill-opacity="0.2"/>
    <text x="12" y="18" class="role-title" fill="#FB7185">🛡️ REVIEWER</text>
    <text x="12" y="45" class="role-sub">Independent adversarial review, invariant verification &amp; PASS approval</text>
    <text x="12" y="75" class="tool-item">independent test runs</text>
    <text x="12" y="95" class="tool-item">git diff &amp; AST verification</text>
    <text x="12" y="115" class="tool-item">work approve --verdict PASS</text>
    <rect x="12" y="125" width="211" height="16" rx="4" fill="#881337" fill-opacity="0.4"/>
    <text x="117" y="136" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDA4AF">Sole Authority to Mark DONE</text>
  </g>

  <!-- Bottom Section: Herdr Worker Multiplexing Layer -->
  <g transform="translate(45, 420)" filter="url(#shadowOrch)">
    <rect width="955" height="105" rx="10" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="955" height="26" rx="10" fill="#1E293B"/>
    <path d="M 0 16 L 0 26 L 955 26 L 955 16 Z" fill="#1E293B"/>
    <circle cx="16" cy="13" r="4" fill="#EF4444"/>
    <circle cx="30" cy="13" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="13" r="4" fill="#10B981"/>
    <text x="60" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38BDF8">CORTEX-IA DELEGATION &amp; HERDR MULTIPLEXING ENGINE</text>

    <!-- Subprocess Info -->
    <g transform="translate(20, 42)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F8FAFC">⚡ Dynamic Leaf Subprocess:</text>
      <text x="210" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">cortex-ia delegate worker --job &lt;id&gt; --request-file &lt;transient.json&gt;</text>
      <text x="0" y="40" font-family="system-ui" font-size="11" fill="#94A3B8">Runs in an isolated dedicated Herdr terminal pane with real-time NDJSON event streaming (tool calls, live spinner, token metrics).</text>
    </g>
  </g>
</svg>
