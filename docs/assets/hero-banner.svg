<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0D131F"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 52px; fill: #FFFFFF; letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; font-weight: 600; font-size: 20px; fill: #94A3B8; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; font-weight: 400; font-size: 15px; fill: #64748B; }
    .badge-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; font-weight: 600; fill: #E2E8F0; }
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #38BDF8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 80 L 1200 80 M 0 160 L 1200 160 M 0 240 L 1200 240 M 0 320 L 1200 320 M 0 400 L 1200 400" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 160 0 L 160 440 M 320 0 L 320 440 M 480 0 L 480 440 M 640 0 L 640 440 M 800 0 L 800 440 M 960 0 L 960 440 M 1120 0 L 1120 440" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Decorative Background Glows -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad)"/>
  <circle cx="1000" cy="300" r="220" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- Top Release Tag -->
  <g transform="translate(60, 50)">
    <rect width="210" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10B981" filter="url(#neonGlow)"/>
    <text x="28" y="18" class="tag" fill="#10B981">v2.3.0 · ENTERPRISE SDD</text>
  </g>

  <!-- Main Title & Branding -->
  <text x="60" y="130" class="title">CORTEX<tspan fill="#00E5FF">-IA</tspan></text>
  <text x="60" y="165" class="subtitle">Deterministic Multi-Agent Control Plane &amp; Orchestration Engine</text>
  <text x="60" y="195" class="desc">SQLite CAS State Machines · Atomic File Leases · OpenSpec SDD · Herdr Multiplexing</text>

  <!-- Feature Pills -->
  <g transform="translate(60, 235)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155"/>
      <circle cx="18" cy="18" r="4" fill="#00E5FF"/>
      <text x="32" y="22" class="badge-text">Transactional DAG</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(175, 0)">
      <rect width="165" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155"/>
      <circle cx="18" cy="18" r="4" fill="#A855F7"/>
      <text x="32" y="22" class="badge-text">Exclusive Leases</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(355, 0)">
      <rect width="160" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155"/>
      <circle cx="18" cy="18" r="4" fill="#EC4899"/>
      <text x="32" y="22" class="badge-text">Live Herdr Stream</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(530, 0)">
      <rect width="150" height="36" rx="8" fill="url(#badgeGrad)" stroke="#334155"/>
      <circle cx="18" cy="18" r="4" fill="#10B981"/>
      <text x="32" y="22" class="badge-text">OpenSpec SDD</text>
    </g>
  </g>

  <!-- Quick Command Box (Bottom Left) -->
  <g transform="translate(60, 305)" filter="url(#softShadow)">
    <rect width="520" height="75" rx="10" fill="#0B111E" stroke="#1E293B" stroke-width="1.5"/>
    <g transform="translate(16, 14)">
      <circle cx="6" cy="6" r="4" fill="#EF4444" opacity="0.8"/>
      <circle cx="20" cy="6" r="4" fill="#F59E0B" opacity="0.8"/>
      <circle cx="34" cy="6" r="4" fill="#10B981" opacity="0.8"/>
      <text x="50" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">terminal</text>
    </g>
    <text x="20" y="52" class="code-text"><tspan fill="#A855F7">$</tspan> cortex-ia install <tspan fill="#64748B">&amp;&amp;</tspan> cortex-ia web <tspan fill="#10B981">--open</tspan></text>
  </g>

  <!-- Right Visual: Control Plane Architecture Graphic -->
  <g transform="translate(730, 50)" filter="url(#softShadow)">
    <!-- Terminal / Dashboard Card -->
    <rect width="410" height="330" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect width="410" height="38" rx="12" fill="#1E293B"/>
    <path d="M 0 26 L 0 38 L 410 38 L 410 26 Z" fill="#1E293B"/>
    <circle cx="20" cy="19" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="4.5" fill="#10B981"/>
    <text x="75" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8">cortex-ia activeboard control plane</text>

    <!-- Node 1: Ready -->
    <g transform="translate(25, 60)">
      <rect width="165" height="65" rx="8" fill="#1E293B" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00E5FF">TASK: activeboard-1.1</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Contracts &amp; Scaffolding</text>
      <rect x="14" y="48" width="55" height="12" rx="3" fill="#00E5FF" fill-opacity="0.2"/>
      <text x="41" y="57" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#00E5FF" text-anchor="middle">READY</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 195 92 L 220 92" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3 3"/>

    <!-- Node 2: In Progress / Claim -->
    <g transform="translate(225, 60)">
      <rect width="160" height="65" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#A855F7">CLAIM: token_9e8a</text>
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Lease: mutation_test.go</text>
      <rect x="12" y="48" width="75" height="12" rx="3" fill="#A855F7" fill-opacity="0.2"/>
      <text x="49" y="57" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#A855F7" text-anchor="middle">IN_PROGRESS</text>
    </g>

    <!-- Arrow Down -->
    <path d="M 305 130 L 305 155" stroke="#64748B" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Node 3: Streaming Worker Terminal Box -->
    <g transform="translate(25, 160)">
      <rect width="360" height="145" rx="8" fill="#090D16" stroke="#38BDF8" stroke-width="1"/>
      <!-- Terminal Bar -->
      <rect width="360" height="22" rx="8" fill="#1E293B"/>
      <path d="M 0 14 L 0 22 L 360 22 L 360 14 Z" fill="#1E293B"/>
      <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38BDF8">🚀 HERDR PANE · agy stream-json (PID 14820)</text>

      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E2E8F0">⚡ <tspan fill="#38BDF8">[investigate]</tspan> Executing task objective</text>
      <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94A3B8">🔧 Tool: view_file [planning-receipt.json]</text>
      <text x="12" y="80" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10B981">   ↳ Done (0.04s) ➔ 142 lines read</text>
      <text x="12" y="100" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94A3B8">🔧 Tool: go test ./internal/delegation/...</text>
      <text x="12" y="118" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10B981">   ↳ Done (1.42s) ➔ ok (coverage: 50.5%)</text>
      
      <!-- Live Indicator -->
      <rect x="12" y="128" width="336" height="8" rx="4" fill="#1E293B"/>
      <rect x="12" y="128" width="220" height="8" rx="4" fill="url(#cyanPurple)"/>
    </g>
  </g>
</svg>
