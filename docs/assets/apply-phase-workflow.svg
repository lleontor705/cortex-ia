<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bgApply" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowApply" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1060" height="620" rx="12" fill="url(#bgApply)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="530" y="32" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700">Implementation Minion &amp; DAG Execution Workflow</text>
  <text x="530" y="50" text-anchor="middle" fill="#64748B" font-size="11">Orchestrator dispatches ready DAG tasks · Implement minions claim &amp; lease · Reviewer independently gates completion</text>

  <!-- Orchestrator Box -->
  <g transform="translate(380, 66)" filter="url(#shadowApply)">
    <rect width="300" height="48" rx="8" fill="#1e2030" stroke="#38BDF8" stroke-width="2"/>
    <text x="150" y="22" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="700">👑 Orchestrator Coordinator</text>
    <text x="150" y="38" text-anchor="middle" fill="#94A3B8" font-size="9.5">board status · reads READY tasks · dispatches implement minions</text>
  </g>

  <!-- Arrows from Orch to Waves / Tasks -->
  <line x1="430" y1="114" x2="170" y2="152" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="167,149 170,158 176,150" fill="#38BDF8"/>
  <line x1="530" y1="114" x2="530" y2="152" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="526,150 530,158 534,150" fill="#38BDF8"/>
  <line x1="630" y1="114" x2="890" y2="152" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="884,150 890,158 893,149" fill="#38BDF8"/>

  <!-- Column 1: Task 1.1 (Parallel Wave 1) -->
  <g transform="translate(45, 155)" filter="url(#shadowApply)">
    <rect width="250" height="150" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <rect width="250" height="24" rx="8" fill="#064E3B" fill-opacity="0.3"/>
    <path d="M 0 16 L 0 24 L 250 24 L 250 16 Z" fill="#064E3B" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#34D399" font-size="11" font-weight="700">⚡ @implement minion (Task 1.1)</text>
    <text x="12" y="40" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">1. work claim task-1.1</text>
    <text x="12" y="56" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">2. work lease (allowed_files)</text>
    <text x="12" y="72" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">3. Red-Green-Refactor loop</text>
    <text x="12" y="88" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">4. Proportional test verification</text>
    <text x="12" y="106" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="9">5. work transition ➔ in_review</text>
    <rect x="10" y="118" width="230" height="22" rx="4" fill="#064E3B" fill-opacity="0.4"/>
    <text x="125" y="133" text-anchor="middle" fill="#6EE7B7" font-size="8.5">Typed Receipt via Tool Call · Clean Chat</text>
  </g>

  <!-- Column 2: Task 1.2 (Parallel Wave 1) -->
  <g transform="translate(405, 155)" filter="url(#shadowApply)">
    <rect width="250" height="150" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <rect width="250" height="24" rx="8" fill="#064E3B" fill-opacity="0.3"/>
    <path d="M 0 16 L 0 24 L 250 24 L 250 16 Z" fill="#064E3B" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#34D399" font-size="11" font-weight="700">⚡ @implement minion (Task 1.2)</text>
    <text x="12" y="40" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">1. work claim task-1.2</text>
    <text x="12" y="56" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">2. work lease (disjoint paths)</text>
    <text x="12" y="72" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">3. Red-Green-Refactor loop</text>
    <text x="12" y="88" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">4. Proportional test verification</text>
    <text x="12" y="106" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="9">5. work transition ➔ in_review</text>
    <rect x="10" y="118" width="230" height="22" rx="4" fill="#064E3B" fill-opacity="0.4"/>
    <text x="125" y="133" text-anchor="middle" fill="#6EE7B7" font-size="8.5">Typed Receipt via Tool Call · Clean Chat</text>
  </g>

  <!-- Column 3: Task 2.1 (Downstream - Waiting for 1.1 & 1.2) -->
  <g transform="translate(765, 155)" filter="url(#shadowApply)">
    <rect width="250" height="150" rx="8" fill="#111827" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect width="250" height="24" rx="8" fill="#334155" fill-opacity="0.3"/>
    <path d="M 0 16 L 0 24 L 250 24 L 250 16 Z" fill="#334155" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#94A3B8" font-size="11" font-weight="700">⏳ Task 2.1 (Downstream Dependency)</text>
    <text x="12" y="50" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">Status: BACKLOG (Locked)</text>
    <text x="12" y="70" fill="#64748B" font-size="9">Depends on: task-1.1, task-1.2</text>
    <text x="12" y="90" fill="#64748B" font-size="9">Cannot be claimed until prior</text>
    <text x="12" y="106" fill="#64748B" font-size="9">tasks receive review PASS.</text>
    <rect x="10" y="118" width="230" height="22" rx="4" fill="#1E293B"/>
    <text x="125" y="133" text-anchor="middle" fill="#94A3B8" font-size="8.5">Auto-unlocks when dependencies pass</text>
  </g>

  <!-- Adversarial Reviewer Gate Section -->
  <g transform="translate(45, 330)" filter="url(#shadowApply)">
    <rect width="970" height="110" rx="8" fill="#111827" stroke="#F43F5E" stroke-width="1.5"/>
    <rect width="970" height="26" rx="8" fill="#881337" fill-opacity="0.2"/>
    <path d="M 0 18 L 0 26 L 970 26 L 970 18 Z" fill="#881337" fill-opacity="0.2"/>
    <text x="20" y="18" fill="#FB7185" font-size="12" font-weight="700">🛡️ Adversarial Reviewer Gate (@reviewer)</text>

    <!-- Reviewer workflow items -->
    <g transform="translate(20, 36)">
      <rect width="280" height="58" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="12" y="18" fill="#FB7185" font-size="10" font-weight="700">1. Independent Verification</text>
      <text x="12" y="34" fill="#CBD5E1" font-size="9">Reruns tests in clean sub-process</text>
      <text x="12" y="48" fill="#94A3B8" font-size="8.5">Inspects git diff &amp; AST delta couples</text>
    </g>

    <g transform="translate(320, 36)">
      <rect width="320" height="58" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="12" y="18" fill="#FB7185" font-size="10" font-weight="700">2. Invariant &amp; Mutation Audits</text>
      <text x="12" y="34" fill="#CBD5E1" font-size="9">Validates contract preservation &amp; immutability</text>
      <text x="12" y="48" fill="#94A3B8" font-size="8.5">Confirms source logic limit ≤ 350 LOC</text>
    </g>

    <g transform="translate(660, 36)">
      <rect width="290" height="58" rx="6" fill="#1E293B" stroke="#059669"/>
      <text x="12" y="18" fill="#34D399" font-size="10" font-weight="700">3. work approve --verdict PASS</text>
      <text x="12" y="34" fill="#A7F3D0" font-size="9">Typed summary + findings to SQLite</text>
      <text x="12" y="48" fill="#6EE7B7" font-size="8.5">Marks task DONE · Releases file locks</text>
    </g>
  </g>

  <!-- SQLite CAS Convergence & Auto Unlock -->
  <g transform="translate(45, 460)" filter="url(#shadowApply)">
    <rect width="970" height="125" rx="8" fill="#090D16" stroke="#334155" stroke-width="1.5"/>
    <rect width="970" height="24" rx="8" fill="#1E293B"/>
    <path d="M 0 16 L 0 24 L 970 24 L 970 16 Z" fill="#1E293B"/>
    <text x="20" y="16" fill="#38BDF8" font-size="11" font-weight="700">⚡ SQLite ACID Convergence &amp; Deterministic DAG Auto-Unlocking</text>

    <g transform="translate(20, 36)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">✓ BEGIN IMMEDIATE CAS Revision Bump (revision + 1)</text>
      <text x="0" y="33" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">✓ Purges all active file leases atomically</text>
      <text x="0" y="51" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">✓ Invokes unlockDependents: finds downstream tasks whose dependencies are 100% PASS</text>
      <text x="0" y="69" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24">➔ Task 2.1 status shifts: BACKLOG ➔ READY (dispatched on next orchestrator wave)</text>
    </g>
  </g>
</svg>
