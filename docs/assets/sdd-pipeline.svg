<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSdd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="sddGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="shadowSdd" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .sdd-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #F8FAFC; text-anchor: middle; }
    .sdd-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748B; text-anchor: middle; }
    .step-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .step-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #94A3B8; }
    .step-cmd { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #38BDF8; }
  </style>

  <rect width="1000" height="400" rx="14" fill="url(#bgSdd)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="500" y="38" class="sdd-title">Specification-Driven Development (SDD) Pipeline</text>
  <text x="500" y="58" class="sdd-sub">OpenSpec Markdown Delta Contracts ➔ Deterministic SQLite Task DAG ➔ Atomic Execution &amp; Review</text>

  <!-- Flow Line -->
  <path d="M 120 180 L 880 180" stroke="url(#sddGrad)" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Step 1: Proposal & Delta Specs -->
  <g transform="translate(45, 90)" filter="url(#shadowSdd)">
    <rect width="165" height="180" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="82" cy="30" r="16" fill="#0284C7"/>
    <text x="82" y="35" class="step-num" fill="#FFF" text-anchor="middle">01</text>
    
    <text x="82" y="65" class="step-title" text-anchor="middle">OpenSpec Design</text>
    <text x="82" y="82" class="step-sub" text-anchor="middle">RFC 2119 Delta Specs</text>
    
    <rect x="12" y="95" width="141" height="65" rx="6" fill="#1E293B"/>
    <text x="20" y="112" class="step-cmd">proposal.md</text>
    <text x="20" y="128" class="step-cmd">specs/**/*.md</text>
    <text x="20" y="144" class="step-cmd">design.md</text>
  </g>

  <!-- Step 2: Task DAG Decomposition -->
  <g transform="translate(230, 90)" filter="url(#shadowSdd)">
    <rect width="165" height="180" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="82" cy="30" r="16" fill="#4F46E5"/>
    <text x="82" y="35" class="step-num" fill="#FFF" text-anchor="middle">02</text>
    
    <text x="82" y="65" class="step-title" text-anchor="middle">DAG Partition</text>
    <text x="82" y="82" class="step-sub" text-anchor="middle">Slice Bounding (≤350 LOC)</text>
    
    <rect x="12" y="95" width="141" height="65" rx="6" fill="#1E293B"/>
    <text x="20" y="115" class="step-cmd">board create</text>
    <text x="20" y="132" class="step-cmd">work create</text>
    <text x="20" y="148" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#A5B4FC">status: backlog</text>
  </g>

  <!-- Step 3: Atomic Implementation -->
  <g transform="translate(415, 90)" filter="url(#shadowSdd)">
    <rect width="170" height="180" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="85" cy="30" r="16" fill="#D97706"/>
    <text x="85" y="35" class="step-num" fill="#FFF" text-anchor="middle">03</text>
    
    <text x="85" y="65" class="step-title" text-anchor="middle">Implementation</text>
    <text x="85" y="82" class="step-sub" text-anchor="middle">Claim &amp; Exclusive Leases</text>
    
    <rect x="12" y="95" width="146" height="65" rx="6" fill="#1E293B"/>
    <text x="20" y="115" class="step-cmd" fill="#FBBF24">work claim</text>
    <text x="20" y="132" class="step-cmd" fill="#FBBF24">work lease</text>
    <text x="20" y="148" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#FCD34D">Herdr stream-json</text>
  </g>

  <!-- Step 4: Adversarial Review -->
  <g transform="translate(605, 90)" filter="url(#shadowSdd)">
    <rect width="165" height="180" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="1.5"/>
    <circle cx="82" cy="30" r="16" fill="#E11D48"/>
    <text x="82" y="35" class="step-num" fill="#FFF" text-anchor="middle">04</text>
    
    <text x="82" y="65" class="step-title" text-anchor="middle">Adversarial Review</text>
    <text x="82" y="82" class="step-sub" text-anchor="middle">Independent Oracle Check</text>
    
    <rect x="12" y="95" width="141" height="65" rx="6" fill="#1E293B"/>
    <text x="20" y="115" class="step-cmd" fill="#FB7185">work transition</text>
    <text x="20" y="132" class="step-cmd" fill="#FB7185">work approve</text>
    <text x="20" y="148" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#FDA4AF">verdict: PASS</text>
  </g>

  <!-- Step 5: Verified Convergence -->
  <g transform="translate(790, 90)" filter="url(#shadowSdd)">
    <rect width="165" height="180" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="82" cy="30" r="16" fill="#059669"/>
    <text x="82" y="35" class="step-num" fill="#FFF" text-anchor="middle">05</text>
    
    <text x="82" y="65" class="step-title" text-anchor="middle">DAG Unlocking</text>
    <text x="82" y="82" class="step-sub" text-anchor="middle">Next Tasks Set to READY</text>
    
    <rect x="12" y="95" width="141" height="65" rx="6" fill="#1E293B"/>
    <text x="20" y="115" class="step-cmd" fill="#34D399">atomic release</text>
    <text x="20" y="132" class="step-cmd" fill="#34D399">unlockDependents</text>
    <text x="20" y="148" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#A7F3D0">status: done</text>
  </g>

  <!-- Bottom Summary Card -->
  <g transform="translate(45, 290)">
    <rect width="910" height="85" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="25" y="28" font-family="system-ui" font-size="12" font-weight="700" fill="#F8FAFC">⚡ Zero-Trust Multi-Agent Coordination</text>
    <text x="25" y="48" font-family="system-ui" font-size="11" fill="#94A3B8">Every task transition is governed by optimistic CAS concurrency control in SQLite. An implementer can never approve their own changes; independent review gates guarantee deterministic quality before any dependency is unlocked.</text>
  </g>
</svg>
