<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" role="img" aria-labelledby="tierTitle tierDesc">
  <title id="tierTitle">Cortex-IA three-tier routing model</title>
  <desc id="tierDesc">The orchestrator routes each request to the smallest workflow that safely fits. Tier 1 is the fast path with no task graph: direct answers, discovery, investigation, spikes. Tier 2 is one bounded task on the default board: direct change, fast TDD, hotfix, ops task, with a claim, file leases and proportional review. Tier 3 is coordinated specification-driven development on its own board: SDD lite and SDD full, with contracts, a dependency graph, parallel implementers and independent review.</desc>
  <defs>
    <marker id="tierArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; fill: #F1F5F9; }
    .sub { font-size: 13px; fill: #93A4BF; }
    .band { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
    .name { font-size: 17px; font-weight: 700; fill: #F1F5F9; }
    .line { font-size: 12.5px; fill: #B6C2D6; }
    .code { font-size: 12px; fill: #CBD5E1; }
    .step { font-size: 12px; fill: #E2E8F0; text-anchor: middle; }
    .note { font-size: 12px; fill: #93A4BF; }
  </style>

  <rect width="1200" height="500" rx="14" fill="#0B1220"/>
  <rect x="0.75" y="0.75" width="1198.5" height="498.5" rx="14" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <text x="48" y="48" class="t h1">Three-tier routing</text>
  <text x="48" y="72" class="t sub">The orchestrator picks the smallest workflow that safely fits the request. Ceremony grows only with risk.</text>

  <!-- request -->
  <rect x="48" y="100" width="1104" height="46" rx="10" fill="#111A2E" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="129" class="t name" text-anchor="middle" style="font-size:15px">User request  →  orchestrator triage</text>
  <path d="M224 146 V176" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#tierArrow)"/>
  <path d="M600 146 V176" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#tierArrow)"/>
  <path d="M976 146 V176" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#tierArrow)"/>

  <!-- Tier 1 -->
  <rect x="48" y="180" width="352" height="264" rx="10" fill="#0F2420" stroke="#34D399" stroke-width="1.5"/>
  <text x="68" y="208" class="t band" fill="#34D399">TIER 1 · FAST PATH</text>
  <text x="68" y="236" class="t name">No task graph</text>
  <text x="68" y="262" class="t line">Questions, onboarding, diagnosis and</text>
  <text x="68" y="280" class="t line">bounded experiments. Nothing is claimed.</text>
  <text x="68" y="312" class="m code">direct-answer · discovery</text>
  <text x="68" y="332" class="m code">investigate · spike · review</text>
  <rect x="68" y="356" width="312" height="68" rx="8" fill="#0B1220" stroke="#1F3B33"/>
  <text x="224" y="384" class="t step">orchestrator → one subagent</text>
  <text x="224" y="406" class="t step">→ answer with evidence</text>

  <!-- Tier 2 -->
  <rect x="424" y="180" width="352" height="264" rx="10" fill="#0E2233" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="444" y="208" class="t band" fill="#38BDF8">TIER 2 · ONE BOUNDED TASK</text>
  <text x="444" y="236" class="t name">Single task, default board</text>
  <text x="444" y="262" class="t line">Clear, reversible, single-domain changes</text>
  <text x="444" y="280" class="t line">with a fast, deterministic check.</text>
  <text x="444" y="312" class="m code">direct-change · fast-tdd</text>
  <text x="444" y="332" class="m code">hotfix · ops-task</text>
  <rect x="444" y="356" width="312" height="68" rx="8" fill="#0B1220" stroke="#1B3A52"/>
  <text x="600" y="384" class="t step">claim → lease files → edit and test</text>
  <text x="600" y="406" class="t step">→ review sized to the risk</text>

  <!-- Tier 3 -->
  <rect x="800" y="180" width="352" height="264" rx="10" fill="#17152F" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="820" y="208" class="t band" fill="#A78BFA">TIER 3 · COORDINATED SDD</text>
  <text x="820" y="236" class="t name">Initiative board and contracts</text>
  <text x="820" y="262" class="t line">Multi-file features, cross-domain or</text>
  <text x="820" y="280" class="t line">high-risk work that spans sessions.</text>
  <text x="820" y="312" class="m code">sdd-lite · sdd-full</text>
  <text x="820" y="332" class="m code">decision-map</text>
  <rect x="820" y="356" width="312" height="68" rx="8" fill="#0B1220" stroke="#332E5C"/>
  <text x="976" y="384" class="t step">spec → task graph → parallel implementers</text>
  <text x="976" y="406" class="t step">→ independent review → archive</text>

  <text x="48" y="476" class="t note">File count is evidence, never the only routing rule. A review tier can be raised with a stated reason and is never lowered.</text>
</svg>
