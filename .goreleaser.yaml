version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cortex-ia
    main: ./cmd/cortex-ia
    binary: cortex-ia
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lleontor705/cortex-ia/internal/app.Version={{.Version}}
      - -X github.com/lleontor705/cortex-ia/internal/app.Commit={{.Commit}}
      - -X github.com/lleontor705/cortex-ia/internal/app.Date={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "cortex-ia_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - scripts/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
